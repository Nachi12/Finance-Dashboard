<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.6; font-size: 15px; }
        .code-box {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 14px;
            color: #4ade80;
            margin: 16px 0;
            text-align: left;
            user-select: all;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            margin-top: 12px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card" id="static-notice">
        <h2>Family Finance Dashboard</h2>
        <p>
            This application is built with <strong>PHP</strong> and must be run using a PHP server (not static Live Server or direct file opening).
        </p>
        <p>Run the following command in your project terminal:</p>
        <div class="code-box">php -S localhost:8080</div>
        <p>Then open:</p>
        <a class="btn" href="http://localhost:8080">Open http://localhost:8080</a>
    </div>

    <script>
        // If served over HTTP from a PHP-capable dev server, redirect directly
        if (window.location.protocol.startsWith('http') && window.location.port === '8080') {
            window.location.href = "dashboard.php";
        }
    </script>
</body>
</html>
